<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dungeon Bar Crawler Carl</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: "Arial Black", Gadget, sans-serif;
            background-image: 
                radial-gradient(circle at 20% 20%, #440000 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, #440000 0%, transparent 40%);
            background-attachment: fixed;
        }

        header {
            background: #000;
            border-bottom: 8px solid #d90429;
            text-align: center;
            position: relative;
        }

        .hero-img-placeholder {
            width: 100%;
            height: 450px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .hero-img-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
            filter: contrast(1.2) brightness(0.8);
        }

        .hero-img-placeholder::after {
            content: " ";
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        h1 {
            font-family: Impact, sans-serif;
            font-size: clamp(2rem, 8vw, 4.5rem);
            margin: -60px 0 0 0;
            text-transform: uppercase;
            position: relative;
            z-index: 10;
            color: #ffffff;
            text-shadow: 4px 4px #d90429, -2px -2px #00f2ff;
        }

        .details {
            font-size: 1.2rem;
            color: #00f2ff;
            margin-bottom: 20px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .content-box {
            max-width: 850px;
            margin: 20px auto 60px;
            padding: 50px;
            background: rgba(10, 10, 10, 0.98);
            border: 2px solid #d90429;
            box-shadow: 0 0 40px rgba(217, 4, 41, 0.3);
        }

        .ai-msg {
            border-left: 6px solid #00f2ff;
            background: rgba(0, 242, 255, 0.05);
            padding: 25px;
            margin-bottom: 40px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        h2 {
            font-family: Impact, sans-serif;
            color: #d90429;
            font-size: 2.5rem;
            border-bottom: 2px solid #d90429;
            margin-top: 0;
        }

        .schedule {
            width: 100%;
            border-collapse: collapse;
        }

        .schedule td {
            padding: 20px 10px;
            border-bottom: 1px solid #222;
            vertical-align: top;
        }

        .time-slot {
            color: #d90429;
            font-size: 1.5rem;
            width: 150px;
        }

        .loc-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            display: block;
            margin-bottom: 5px;
        }

        .loc-desc {
            font-family: Arial, sans-serif;
            color: #ccc;
            font-size: 1rem;
        }
