<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Annapolis Ascendency | Dungeon Carl Bar Crawler</title>
    <style>
        :root {
            --gauntlet-black: #000000;
            --boxer-white: #ffffff;
            --carl-red: #cc0000;       /* Bloody red */
            --blood-dark: #800000;
            --system-blue: #00f2ff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--gauntlet-black);
            
            /* COMPLEX CSS BACKGROUND: Black with Blood-Spattered Boxers */
            background-image: 
                /* Layer 1: Blood Spatter (Chaotic Red Gradients) */
                radial-gradient(ellipse at 10% 90%, var(--blood-dark) 0%, transparent 15%),
                radial-gradient(ellipse at 80% 20%, var(--carl-red) 0%, transparent 20%),
                radial-gradient(circle at 45% 55%, var(--blood-dark) 0%, transparent 10%),
                
                /* Layer 2: White Boxer Shorts Pattern */
                linear-gradient(rgba(255,255,255,1), rgba(255,255,255,1)), /* Solid White Box */
                
                /* Layer 3: Few Scattered Red Hearts (Masked) */
                radial-gradient(circle at 10px 10px, var(--carl-red) 10px, transparent 11px),
                radial-gradient(circle at 30px 10px, var(--carl-red) 10px, transparent 11px),
                conic-gradient(from 210deg at 20px 15px, var(--carl-red) 60deg, transparent 61deg);

            /* Layer Positioning and Sizing */
            background-position: 
                0 0, 0 0, 0 0,         /* Blood Spatters */
                50px 50px,             /* Boxer Location */
                50px 50px, 50px 50px, 50px 50px; /* Hearts (same relative pos) */
            
            background-size: 
                100% 100%, 100% 100%, 100% 100%, /* Spatters (full screen) */
                100px 100px,                     /* Boxer Shorts Size */
                100px 100px, 100px 100px, 100px 100px; /* Hearts Size */

            background-repeat: 
                no-repeat, no-repeat, no-repeat, /* Spatters */
                no-repeat, no-repeat, no-repeat, no-repeat; /* Shorts (Repeat this for whole pattern if desired: repeat) */
            
            /* Set to 'repeat' if you want a wallpaper of blood-spattered shorts. 
               Left as 'no-repeat' so a few shorts float on the black. */
            background-repeat: repeat; 
            
            color: white; /* Standard text on black */
        }

        header {
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 50px 20px;
            text-align: center;
            /* GAUNTLET EFFECT */
            clip-path: polygon(0% 0%, 100% 0%, 100% 85%, 95% 100%, 90% 85%, 85% 100%, 80% 85%, 75% 100%, 70% 85%, 65% 100%, 60% 85%, 55% 100%, 50% 85%, 45% 100%, 40% 85%, 35% 100%, 30% 85%, 25% 100%, 20% 85%, 15% 100%, 10% 85%, 5% 100%, 0% 85%);
            border-bottom: 4px solid var(--carl-red);
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px;
            background: rgba(0, 0, 0, 0.95); /* Near solid black container */
            border-left: 10px solid var(--gauntlet-black);
            border-right: 10px solid var(--gauntlet-black);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            margin-top: -20px;
        }

        h2 { text-transform: uppercase; border-bottom: 2px solid var(--carl-red); padding-bottom: 10px; margin-top: 40px;}
