        body {

            background-attachment: fixed;

            background: var(--gauntlet-black);
            border-bottom: 5px solid var(--carl-red);
            text-align: center;
            padding-bottom: 40px;
        }

            width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-bottom: 2px solid var(--system-blue);
        }

            font-size: 4.5rem;

            text-shadow: 4px 4px var(--carl-red);
        }

        .subtitle {
            font-family: 'Bebas Neue', sans-serif;

            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .container {
            max-width: 900px;
            margin: -50px auto 100px;
            padding: 50px;
            background: rgba(10, 10, 10, 0.98);
            border: 1px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,1);

            z-index: 10;
        }

        .system-msg {
            border-left: 4px solid var(--system-blue);
            background: rgba(0, 242, 255, 0.03);
            padding: 30px;
            margin-bottom: 40px;
            line-height: 1.8;
            font-weight: 300;
            font-size: 1.05rem;
        }

        h2 { 
            font-family: 'Bebas Neue', sans-serif; 
            font-size: 2.5rem; 
            color: var(--carl-red); 
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .quest-log { width: 100%; border-collapse: collapse; margin-top: 30px; }
        .quest-log td { padding: 25px 15px; border-bottom: 1px solid #222; }
        
        .time { 
            font-family: 'Bebas Neue', sans-serif; 
            color: var(--carl-red); 
            font-size: 1.8rem; 
            width: 140px; 
        }

            font-weight: 700;

            margin-bottom: 5px; 
            color: var(--white-boxer);
            text-transform: uppercase;
        }

        .objective {
            color: #aaa;
            font-size: 0.95rem;
        }
